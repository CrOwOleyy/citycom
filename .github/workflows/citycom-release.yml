name: CityCom - Release (GitHub)

# Packages CityCom on top of Mozilla's prebuilt engine (artifact build) and
# attaches a portable zip to the GitHub release of the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex. v1.0). Il est créé s'il n'existe pas."
        required: true

permissions:
  contents: write

concurrency:
  group: citycom-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository_owner != 'mozilla-firefox'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MOZBUILD_STATE_PATH: C:\mozbuild-state
      MOZCONFIG: ${{ github.workspace }}\mozconfig-citycom-dev
      MOZ_SOURCE_GIT_REPO: ${{ github.server_url }}/${{ github.repository }}
      PYTHON: C:\mozilla-build\python3\python.exe
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure git for a large checkout
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install MozillaBuild
        run: |
          $setup = "$env:RUNNER_TEMP\MozillaBuildSetup.exe"
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile $setup
          Start-Process $setup -ArgumentList "/S" -Wait
          if (-not (Test-Path $env:PYTHON)) { throw "MozillaBuild n'a pas été installé" }
          New-Item -ItemType Directory -Force $env:MOZBUILD_STATE_PATH | Out-Null

      - name: Fetch French translations
        run: |
          $l10n = "$env:MOZBUILD_STATE_PATH\l10n-central"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/mozilla-l10n/firefox-l10n $l10n
          git -C $l10n sparse-checkout set fr

      - name: Build
        run: |
          & $env:PYTHON .\mach build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package with French language pack
        run: |
          & $env:PYTHON .\mach build langpack-fr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON .\mach package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $langpack = Get-ChildItem obj-citycom-dev\dist\*\xpi\*.fr.langpack.xpi | Select-Object -First 1
          $zip = Get-ChildItem obj-citycom-dev\dist\*.win64.zip | Select-Object -First 1
          $out = "$env:RUNNER_TEMP\CityCom-$env:TAG-win64.zip"
          & $env:PYTHON browser\branding\citycom\tools\finalize_zip.py $zip.FullName $langpack.FullName $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZIP=$out" >> $env:GITHUB_ENV

      - name: Publish release
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = @(
              "Navigateur CityCom basé sur Firefox. Dézippe, puis lance firefox.exe.",
              "",
              "- **CityCom-$env:TAG-win64.zip** : moteur précompilé de Mozilla avec l'interface CityCom.",
              "- **CityCom-$env:TAG-win64-natif.zip** (si présent) : build complet optimisé pour un PC précis (PGO, LTO, CPU natif)."
            ) -join "`n"
            gh release create $env:TAG --target $env:GITHUB_SHA --title "CityCom $env:TAG" --notes $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:TAG $env:ZIP --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
